name: Build Cinejoy IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify catalog adapter
        run: npm ci --ignore-scripts && npm test
      - name: Prepare Xcode
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Build unsigned device IPA
        run: bash tools/build.sh
      - name: Upload sideloadable package
        uses: actions/upload-artifact@v4
        with:
          name: Cinejoy-IPA
          path: dist/Cinejoy-unsigned.ipa
          if-no-files-found: error
      - name: Build and preview in Simulator
        run: bash tools/preview.sh
      - name: Upload Simulator previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cinejoy-previews
          path: dist/previews/
          if-no-files-found: ignore
